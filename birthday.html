<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<style>
  :root { --bg1:#ffe3ec; --bg2:#e8d9ff; --accent:#ff4d79; --ink:#4a2040; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    overflow-x: hidden;
  }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .heart { position: fixed; bottom: -40px; z-index: 1; opacity: .7; animation: floatUp linear forwards; pointer-events: none; }
  @keyframes floatUp { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

  section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; text-align: center; position: relative; z-index: 2; }
  h1 { font-size: clamp(2.2rem, 8vw, 4.5rem); line-height: 1.1; }
  h1 span { color: var(--accent); }
  h2 { font-size: clamp(1.5rem, 5vw, 2.2rem); margin-bottom: 24px; }
  p.sub { font-size: 1.15rem; margin-top: 14px; opacity: .85; }

  button {
    font: inherit; font-size: 1.1rem; background: var(--accent); color: #fff; border: 0;
    padding: 14px 28px; border-radius: 999px; cursor: pointer; margin-top: 24px;
    box-shadow: 0 6px 18px rgba(255,77,121,.4); transition: transform .15s;
  }
  button:active { transform: scale(.95); }

  .card { background: rgba(255,255,255,.75); border-radius: 22px; padding: 28px 24px; max-width: 520px; width: 100%; box-shadow: 0 10px 30px rgba(74,32,64,.12); }

  /* counter */
  .counter { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .counter div { background: rgba(255,255,255,.75); border-radius: 16px; padding: 16px 18px; min-width: 84px; }
  .counter b { display: block; font-size: 2rem; color: var(--accent); }

  /* reasons */
  #reason { min-height: 90px; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; font-style: italic; }

  /* timeline */
  .timeline { max-width: 560px; width: 100%; text-align: left; border-left: 3px solid var(--accent); padding-left: 22px; }
  .event { margin-bottom: 28px; opacity: 0; transform: translateY(20px); transition: all .7s; }
  .event.show { opacity: 1; transform: none; }
  .event small { color: var(--accent); font-weight: bold; letter-spacing: .05em; }
  .event img { width: 100%; border-radius: 14px; margin-top: 10px; display: block; }

  /* letter */
  #letter { white-space: pre-wrap; text-align: left; font-size: 1.15rem; line-height: 1.7; min-height: 220px; }
  .cursor { display: inline-block; width: 2px; background: var(--ink); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<!-- 1. HERO -->
<section>
  <p class="sub" id="heroTop"></p>
  <h1>Happy Birthday,<br><span id="name"></span> 🎂</h1>
  <p class="sub">I made something just for you. Scroll down ↓</p>
  <button id="partyBtn">Tap for a surprise 🎉</button>
</section>

<!-- 2. DAYS TOGETHER -->
<section>
  <h2>Time we've been together 💕</h2>
  <div class="counter">
    <div><b id="cDays">0</b>days</div>
    <div><b id="cHours">0</b>hours</div>
    <div><b id="cMins">0</b>minutes</div>
    <div><b id="cSecs">0</b>seconds</div>
  </div>
  <p class="sub">…and I'd happily do every second again.</p>
</section>

<!-- 3. TIMELINE -->
<section>
  <h2>Our story so far</h2>
  <div class="timeline" id="timeline"></div>
</section>

<!-- 4. REASONS -->
<section>
  <h2>Reasons I love you</h2>
  <div class="card">
    <div id="reason">Tap the button 👇</div>
    <button id="reasonBtn">Show me a reason</button>
  </div>
</section>

<!-- 5. LETTER -->
<section>
  <h2>A little letter for you 💌</h2>
  <div class="card"><div id="letter"></div></div>
</section>

<script>
/* ============================================================
   ✏️  EDIT EVERYTHING IN THIS BLOCK TO MAKE IT HERS
   ============================================================ */
const CONFIG = {
  herName: "Her Name",                 // her name or nickname
  yourName: "Your Name",
  heroTop: "To the love of my life,",
  // when you got together (YYYY-MM-DDTHH:MM:SS)
  togetherSince: "2023-02-14T00:00:00",

  // Add as many as you like. "photo" is optional: put an image file next
  // to this html file (e.g. "photos/first-date.jpg") or leave it as "".
  timeline: [
    { date: "Feb 14, 2023", title: "The day we met",     text: "I didn't know it yet, but my life was about to change.", photo: "" },
    { date: "Apr 2023",     title: "Our first date",      text: "I was so nervous. You laughed at my joke and I was gone.", photo: "" },
    { date: "Aug 2024",     title: "Our first trip",      text: "Remember when we got lost and it was the best day ever?", photo: "" },
    { date: "Today",        title: "Your birthday 🎂",    text: "Another year of you being you. I'm so lucky.", photo: "" }
  ],

  reasons: [
    "The way you laugh at your own jokes before you finish them.",
    "You make ordinary days feel special.",
    "You're kind to everyone, even when no one is watching.",
    "Your smile fixes my worst days.",
    "You believe in me when I don't.",
    "You're my favorite person to do nothing with.",
    "Add your own real reasons here ❤️"
  ],

  letter:
`My love,

Happy birthday! I wanted to give you something that came from me,
so I wrote this with my own hands (and a lot of coffee).

Thank you for every laugh, every hug, and every moment we've shared.
You make me want to be a better person every day.

I can't wait to celebrate many more birthdays with you.

I love you.

— ${"Your Name"}`
};
/* ============================================================ */

// ---- fill text
document.getElementById("name").textContent = CONFIG.herName;
document.getElementById("heroTop").textContent = CONFIG.heroTop;
document.title = "Happy Birthday " + CONFIG.herName;

// ---- days together counter
const since = new Date(CONFIG.togetherSince).getTime();
function tick() {
  const d = Math.max(0, Date.now() - since);
  document.getElementById("cDays").textContent  = Math.floor(d / 864e5);
  document.getElementById("cHours").textContent = Math.floor(d / 36e5);
  document.getElementById("cMins").textContent  = Math.floor(d / 6e4).toLocaleString();
  document.getElementById("cSecs").textContent  = Math.floor(d / 1e3).toLocaleString();
}
tick(); setInterval(tick, 1000);

// ---- timeline (fade in on scroll)
const tl = document.getElementById("timeline");
CONFIG.timeline.forEach(e => {
  const div = document.createElement("div");
  div.className = "event";
  div.innerHTML = `<small>${e.date}</small><h3>${e.title}</h3><p>${e.text}</p>` +
                  (e.photo ? `<img src="${e.photo}" alt="${e.title}">` : "");
  tl.appendChild(div);
});
const io = new IntersectionObserver(es => es.forEach(x => x.isIntersecting && x.target.classList.add("show")), { threshold: .3 });
document.querySelectorAll(".event").forEach(el => io.observe(el));

// ---- reasons
let ri = -1;
document.getElementById("reasonBtn").onclick = () => {
  let n; do { n = Math.floor(Math.random() * CONFIG.reasons.length); } while (n === ri && CONFIG.reasons.length > 1);
  ri = n;
  document.getElementById("reason").textContent = CONFIG.reasons[n];
  burst(window.innerWidth / 2, window.innerHeight / 2, 30);
};

// ---- typewriter letter (starts when scrolled into view)
const letterEl = document.getElementById("letter");
const letterText = CONFIG.letter.replace("Your Name", CONFIG.yourName);
let typed = false;
new IntersectionObserver((es, ob) => {
  if (es[0].isIntersecting && !typed) {
    typed = true; let i = 0;
    const t = setInterval(() => {
      letterEl.textContent = letterText.slice(0, ++i);
      if (i >= letterText.length) { clearInterval(t); burst(window.innerWidth/2, window.innerHeight/2, 120); }
    }, 35);
  }
}, { threshold: .6 }).observe(letterEl);

// ---- floating hearts
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = ["💖","💕","💗","🌸","✨"][Math.floor(Math.random()*5)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 16 + Math.random() * 26 + "px";
  h.style.animationDuration = 6 + Math.random() * 6 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 12000);
}, 700);

// ---- confetti
const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener("resize", resize);
let parts = [];
const colors = ["#ff4d79","#ffb703","#8ecae6","#b388ff","#ffd6e0","#70e000"];
function burst(x, y, n = 150) {
  for (let i = 0; i < n; i++) parts.push({
    x, y, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 3,
    s: 5 + Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)],
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 160
  });
}
(function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => {
    p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.life / 40);
    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore();
  });
  requestAnimationFrame(loop);
})();
document.getElementById("partyBtn").onclick = () => {
  burst(innerWidth * .25, innerHeight * .6); burst(innerWidth * .75, innerHeight * .6);
};
window.addEventListener("load", () => setTimeout(() => burst(innerWidth / 2, innerHeight / 2, 200), 500));
</script>
</body>
</html>
